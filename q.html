<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Card For Ekshu</title>
  <style>
    :root {
      --bg-color: #fcedf2;
      --card-bg: #ffffff;
      --soft-pink: #ffeef2;
      --border-pink: #f8b5c4;
      --text-dark: #3a2e4c;
      --text-light: #706385;
      --accent-purple: #8a71ad;
    }

    body {
      background-color: var(--bg-color);
      background-image: radial-gradient(#f0cbda 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .qr-card {
      background: var(--card-bg);
      border-radius: 32px;
      padding: 35px 25px 30px 25px;
      box-shadow: 0 12px 35px rgba(230, 160, 185, 0.3);
      text-align: center;
      width: 100%;
      max-width: 300px;
      border: 3px solid #fff;
      position: relative;
    }

    .tag {
      background: var(--soft-pink);
      color: #e05275;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 6px 16px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 20px;
      border: 1px dashed var(--border-pink);
      text-transform: uppercase;
    }

    .qr-frame {
      background: #fff0f5;
      border: 2px dashed #ffb7c5;
      border-radius: 24px;
      padding: 16px;
      display: inline-block;
      box-shadow: inset 0 0 12px rgba(255, 183, 197, 0.25);
    }

    .qr-frame img {
      width: 210px;
      height: 210px;
      border-radius: 14px;
      display: block;
      object-fit: contain;
    }

    h3 {
      color: var(--text-dark);
      margin: 18px 0 6px 0;
      font-size: 1.2rem;
    }

    p {
      color: var(--text-light);
      font-size: 0.85rem;
      margin: 0;
    }

    .footer-heart {
      margin-top: 15px;
      font-size: 1.1rem;
      color: var(--accent-purple);
    }
  </style>
</head>
<body>

  <div class="qr-card">
    <div class="tag">💖 SCAN ME EKSHU ❣️</div>
    
    <div class="qr-frame">
      <img src="https://raw.githubusercontent.com/freakup-guy24/Day/main/qr_code.png" alt="Scan QR Code">
    </div>

    <h3>Surprise For u Baby</h3>
    <p>Open ur camera & scan to view(eheheh)</p>
    <div class="footer-heart">urs, Aayu ❤️‍🩹</div>
  </div>

</body>
</html>
